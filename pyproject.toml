[project]
name = "ashare-mcp-server"
version = "0.2.0"
description = "MCP server for A-share market data, paper trading, backtesting and fundamentals (akshare + tushare)"
requires-python = ">=3.10"
dependencies = [
    "mcp>=1.8,<2",
    "akshare>=1.16",
    "tushare>=1.4.29",
    "pandas>=2.0",
    "numpy>=1.24",
    "streamlit>=1.65.0",
    "plotly>=7.1.0",
]

[project.optional-dependencies]
web = ["fastapi>=0.115", "uvicorn>=0.30"]

[project.scripts]
ashare-mcp-server = "ashare_mcp.server:main"
ashare-web = "ashare_mcp.web.__main__:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ashare_mcp"]
