name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e . pytest
      - name: Unit tests (offline)
        run: pytest -q tests/
      - name: MCP tools smoke
        run: python -c "import asyncio; from ashare_mcp.server import mcp; t=asyncio.run(mcp.get_tools()); print(len(t), 'tools')"
