name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: pip install -e ".[web]" pytest
      - name: Unit tests (offline)
        run: pytest -q tests/
      - name: MCP tools smoke
        run: python -c "import asyncio; from ashare_mcp.server import mcp; t=asyncio.run(mcp.list_tools()); print(len(t), 'tools')"

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build frontend
        run: |
          cd web
          npm ci
          npm run build
